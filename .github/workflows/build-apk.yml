name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - name: Point the app to this repo's GitHub Pages site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.server.url='https://'+process.env.OWNER+'.github.io/'+process.env.REPO+'/';fs.writeFileSync(f,JSON.stringify(c,null,2));"
      - name: Create Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Prepare icon from repository root
        run: mkdir -p resources && cp icon.png resources/icon.png
      - name: Generate app icons from resources/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0f1a24" --iconBackgroundColorDark "#0f1a24"
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AW-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
