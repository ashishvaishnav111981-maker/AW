<!doctype html>
<html lang="hi" data-shell="bundled">
<head>
<script>
// APK के अंदर वाली फ़ाइल: फ़ोन में अपडेट सेव हो, तो उसी को दिखाओ
if (document.documentElement.dataset.shell === 'bundled') {
  (function () {
    try {
      const saved = localStorage.getItem('aw-app-html');
      if (!saved) return;
      if (localStorage.getItem('aw-app-pending')) {
        // पिछली बार अपडेट पूरा नहीं चला, इसलिए उसे हटाकर मूल वर्ज़न चलाओ
        localStorage.removeItem('aw-app-html');
        localStorage.removeItem('aw-app-pending');
        return;
      }
      localStorage.setItem('aw-app-pending', '1');
      document.open(); document.write(saved); document.close();
    } catch (e) {}
  })();
}
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// हर अपडेट में यह वर्ज़न बदलें (जैसे 'AW-3'), तभी "अपडेट" बटन नया वर्ज़न पहचानेगा
const VERSION = 'AW-3';

const TOPICS = {
  lever: { threeD: true },
  body: { threeD: false, note: 'शरीर का 3D मॉडल (हड्डियाँ, अंग) अभी जोड़ना बाकी है।' },
  physics: { threeD: false },
  chemistry: { threeD: false, note: 'बॉन्ड बनने का 3D दृश्य अभी जोड़ना बाकी है।' },
  notes: { threeD: false, notes: true },
};

const $ = (id) => document.getElementById(id);
const wrap = $('wrap'), panel = $('panel'), msg = $('msg');
const setMsg = (t) => { msg.textContent = t; };

// Jarvis या दूसरे कंट्रोलर के लिए कमांड: AW.run('toggleExplode')
const commands = {};
const registerCommand = (name, fn) => { commands[name] = fn; };
window.AW = { run: (name, arg) => commands[name]?.(arg) };

// 3D स्टेज
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1a24);
const HOME_POS = new THREE.Vector3(4, 3, 6), HOME_TARGET = new THREE.Vector3(0, 0, 0);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.copy(HOME_POS);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.5; controls.maxDistance = 14;
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(5, 8, 5);
scene.add(sun);

// लीवर के हिस्से (सादे शेप)
const lever = new THREE.Group();
scene.add(lever);
const mat = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.5, transparent: true });
const parts = {
  beam: { mesh: new THREE.Mesh(new THREE.BoxGeometry(6, 0.25, 0.6), mat(0x3fb8af)), pos: [0, 0.125, 0], off: [0, 0, 0], label: 'बीम (छड़)' },
  fulcrum: { mesh: new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 32), mat(0x8ea3b0)), pos: [0, -0.6, 0], off: [0, -1.2, 0], label: 'फुलक्रम (आधार बिंदु)' },
  load: { mesh: new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat(0xf2a541)), pos: [-2.2, 0.65, 0], off: [-1, 1.2, 0], label: 'भार (Load)' },
  effort: { mesh: new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 16), mat(0x9b8cff)), pos: [2.2, 0.65, 0], off: [1, 1.2, 0], label: 'बल (Effort)' },
};
for (const [key, p] of Object.entries(parts)) {
  p.mesh.name = key;
  p.mesh.userData.label = p.label;
  p.home = new THREE.Vector3(...p.pos);
  p.away = p.home.clone().add(new THREE.Vector3(...p.off));
  p.mesh.position.copy(p.home);
  lever.add(p.mesh);
}

// अतिरिक्त वज़न जोड़ना/हटाना
const SLOTS = [-1.2, 1.2, -0.4, 0.4, 0];
const weights = [];
function addWeight() {
  if (weights.length >= 10) return;
  const i = weights.length;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat(0xf2a541));
  m.position.set(SLOTS[i % 5], 0.5 + Math.floor(i / 5) * 0.5, 0);
  m.userData.label = 'अतिरिक्त भार';
  lever.add(m);
  weights.push(m);
}
function removeWeight() {
  const m = weights.pop();
  if (!m) return;
  if (state.selected === m) state.selected = null;
  lever.remove(m);
  m.geometry.dispose();
  m.material.dispose();
}

const state = { selected: null, transparent: false, exploded: false, goal: null };

function applyStyle() {
  for (const m of lever.children) {
    const fade = state.transparent && m !== state.selected;
    m.material.opacity = fade ? 0.3 : 1;
    m.material.depthWrite = !fade;
    m.material.emissive.set(m === state.selected ? 0x663300 : 0x000000);
  }
}

function zoomToSelected() {
  if (!state.selected) return;
  const t = new THREE.Vector3();
  state.selected.getWorldPosition(t);
  state.goal = { target: t, pos: t.clone().add(new THREE.Vector3(1.2, 0.8, 2)) };
}

// टैप से हिस्सा चुनना (ड्रैग होने पर नहीं)
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  const moved = downAt ? Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) : 99;
  downAt = null;
  if (moved > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(lever.children, false)[0];
  state.selected = hit ? hit.object : null;
  applyStyle();
  renderPanel();
});

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);

function animate() {
  requestAnimationFrame(animate);
  if (!wrap.offsetParent) return; // 3D स्क्रीन दिख न रही हो तो रेंडर न करें
  for (const p of Object.values(parts)) p.mesh.position.lerp(state.exploded ? p.away : p.home, 0.1);
  if (state.goal) {
    controls.target.lerp(state.goal.target, 0.08);
    camera.position.lerp(state.goal.pos, 0.08);
    if (camera.position.distanceTo(state.goal.pos) < 0.01) state.goal = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

// पैनल और टॉपिक
let currentTopic = 'lever';

function renderPanel() {
  if (currentTopic === 'lever') {
    const sel = state.selected?.userData.label;
    panel.innerHTML = `
      <p>${sel ? `चुना गया: <b>${sel}</b>` : 'किसी हिस्से पर टैप करें। उंगली से घुमाकर लीवर को हर तरफ़ से देखें।'}</p>
      <div class="row">
        <button data-act="zoom" ${sel ? '' : 'disabled'}>ज़ूम करें</button>
        <button data-act="transparent" class="${state.transparent ? 'on' : ''}">पारदर्शी</button>
        <button data-act="explode" class="${state.exploded ? 'on' : ''}">हिस्से अलग करें</button>
        <button data-act="add">वज़न जोड़ें</button>
        <button data-act="remove">वज़न हटाएँ</button>
        <button data-act="home">पूरा दृश्य</button>
      </div>`;
  } else if (currentTopic === 'physics') {
    panel.innerHTML = `
      <p>भौतिकी का सवाल लिखें।</p>
      <textarea id="q" rows="2"></textarea>
      <div class="row"><button data-act="solve">हल करें</button></div>
      <p id="out"></p>`;
  } else if (currentTopic === 'notes') {
    renderNotes();
  } else {
    panel.innerHTML = `<p>${TOPICS[currentTopic].note ?? ''}</p>`;
  }
}

// अभी AI बैकएंड नहीं जुड़ा है, इसलिए यह सिर्फ़ संदेश देता है
async function solvePhysicsAI(question) {
  return 'AI बैकएंड अभी जुड़ा नहीं है, इसलिए यह सवाल अभी हल नहीं हो सकता।';
}

async function solve() {
  const q = $('q').value.trim();
  const out = $('out');
  if (!q) { out.textContent = 'पहले सवाल लिखें।'; return; }
  out.textContent = 'हल हो रहा है...';
  out.textContent = await solvePhysicsAI(q);
}

panel.addEventListener('click', (e) => {
  const act = e.target.closest('button')?.dataset.act;
  if (!act) return;
  if (act === 'solve') return solve();
  if (act === 'zoom') zoomToSelected();
  if (act === 'transparent') { state.transparent = !state.transparent; applyStyle(); }
  if (act === 'explode') state.exploded = !state.exploded;
  if (act === 'add') { addWeight(); applyStyle(); }
  if (act === 'remove') { removeWeight(); applyStyle(); }
  if (act === 'home') { state.goal = { target: HOME_TARGET.clone(), pos: HOME_POS.clone() }; state.selected = null; applyStyle(); }
  renderPanel();
});

function setTopic(key) {
  if (!TOPICS[key]) return;
  currentTopic = key;
  document.querySelectorAll('#topics button').forEach((b) => b.classList.toggle('on', b.dataset.topic === key));
  wrap.style.display = TOPICS[key].threeD ? '' : 'none';
  panel.classList.toggle('full', key === 'notes');
  renderPanel();
}
$('topics').addEventListener('click', (e) => {
  const key = e.target.closest('button')?.dataset.topic;
  if (key) setTopic(key);
});

registerCommand('openTopic', setTopic);
registerCommand('toggleTransparent', () => { state.transparent = !state.transparent; applyStyle(); renderPanel(); });
registerCommand('toggleExplode', () => { state.exploded = !state.exploded; renderPanel(); });

// ---- नोट्स: विषय, फिर चैप्टर, फिर ब्लॉक वाला नोट (अपने-आप सेव) ----
const SUBJECTS = { bio: 'बायोलॉजी', phy: 'फिज़िक्स', chem: 'केमिस्ट्री' };
const NOTE_KEY = 'aw-notes-v1';
let notesDB = null;
try { notesDB = JSON.parse(localStorage.getItem(NOTE_KEY)); } catch { notesDB = null; }
notesDB ??= Object.fromEntries(Object.keys(SUBJECTS).map((s) => [s, Array.from({ length: 8 }, (_, i) => ({ id: s + '-' + i, name: 'चैप्टर ' + (i + 1), blocks: [] }))]));
let notesView = { subject: null, chapter: null };
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const saveNotes = () => { try { localStorage.setItem(NOTE_KEY, JSON.stringify(notesDB)); } catch { setMsg('नोट सेव नहीं हो पाया, फ़ोन की जगह भर सकती है।'); } };
const curCh = () => (notesDB[notesView.subject] || []).find((c) => c.id === notesView.chapter);

function renderNotes() {
  if (!notesView.subject) {
    panel.innerHTML = '<p>विषय चुनें</p><div class="row">' + Object.entries(SUBJECTS).map(([k, n]) => `<button data-ns="${k}">${n}</button>`).join('') + '</div>';
  } else if (!notesView.chapter) {
    const list = notesDB[notesView.subject];
    panel.innerHTML = `
      <div class="head"><button data-nback="subj">← विषय</button><b>${SUBJECTS[notesView.subject]}</b></div>
      <div class="row add"><input id="newCh" placeholder="नया चैप्टर का नाम" /><button data-nadd="1">जोड़ें</button></div>
      <ul class="list">${list.map((c) => `<li><button data-nopen="${c.id}">${esc(c.name)}</button><span>${c.blocks.length} ब्लॉक</span></li>`).join('')}</ul>`;
  } else {
    const ch = curCh();
    panel.innerHTML = `
      <div class="head"><button data-nback="ch">← चैप्टर सूची</button></div>
      <input id="ttl" class="title" value="${esc(ch.name)}" />
      <div>${ch.blocks.map((b, i) => blockHTML(b, i)).join('')}</div>
      <div class="row tools">
        <button data-ntype="h">शीर्षक</button>
        <button data-ntype="p">पैराग्राफ़</button>
        <button data-ntype="bul">बुलेट</button>
        <button data-ntype="chk">चेकलिस्ट</button>
        <button data-ntype="imp">ज़रूरी बॉक्स</button>
        <button data-ntype="frm">फ़ॉर्मूला</button>
        <button data-ntype="div">लाइन</button>
        <label class="btn">फोटो / डायग्राम<input id="img" type="file" accept="image/*" hidden /></label>
      </div>`;
  }
}

function blockHTML(b, i) {
  let body;
  if (b.type === 'div') body = '<hr />';
  else if (b.type === 'img') body = `<img src="${b.src}" alt="डायग्राम" />`;
  else if (b.type === 'chk') body = `<label><input type="checkbox" data-ck="${i}" ${b.done ? 'checked' : ''} /><input class="ed" data-bi="${i}" value="${esc(b.text)}" /></label>`;
  else body = `<textarea class="ed" data-bi="${i}" rows="2">${esc(b.text)}</textarea>`;
  return `<div class="blk ${b.type}">${body}<div class="bt"><button data-mv="${i}" data-d="-1">↑</button><button data-mv="${i}" data-d="1">↓</button><button data-del="${i}">✕</button></div></div>`;
}

async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  await img.decode();
  const k = Math.min(1, 1024 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k);
  c.height = Math.round(img.height * k);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', 0.8);
}

panel.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t || currentTopic !== 'notes') return;
  const d = t.dataset;
  if (d.ns) notesView = { subject: d.ns, chapter: null };
  else if (d.nback) notesView = d.nback === 'subj' ? { subject: null, chapter: null } : { ...notesView, chapter: null };
  else if (d.nopen) notesView.chapter = d.nopen;
  else if (d.nadd) {
    const v = $('newCh').value.trim();
    if (!v) return setMsg('चैप्टर का नाम लिखें।');
    notesDB[notesView.subject].unshift({ id: Date.now().toString(36), name: v, blocks: [] });
    saveNotes();
  }
  else if (d.ntype) { curCh().blocks.push({ type: d.ntype, text: '' }); saveNotes(); }
  else if (d.mv !== undefined) {
    const bl = curCh().blocks, i = +d.mv, j = i + +d.d;
    if (j >= 0 && j < bl.length) { [bl[i], bl[j]] = [bl[j], bl[i]]; saveNotes(); }
  }
  else if (d.del !== undefined) { curCh().blocks.splice(+d.del, 1); saveNotes(); }
  else return;
  renderPanel();
});

panel.addEventListener('input', (e) => {
  const ch = currentTopic === 'notes' && curCh();
  if (!ch) return;
  if (e.target.id === 'ttl') { ch.name = e.target.value.trim() || ch.name; saveNotes(); }
  else if (e.target.dataset.bi !== undefined) { ch.blocks[+e.target.dataset.bi].text = e.target.value; saveNotes(); }
});

panel.addEventListener('change', async (e) => {
  const ch = currentTopic === 'notes' && curCh();
  if (!ch) return;
  if (e.target.id === 'img' && e.target.files[0]) {
    try { ch.blocks.push({ type: 'img', src: await shrinkImage(e.target.files[0]) }); saveNotes(); renderPanel(); }
    catch { setMsg('फोटो नहीं जुड़ पाई।'); }
  } else if (e.target.dataset.ck !== undefined) {
    ch.blocks[+e.target.dataset.ck].done = e.target.checked;
    saveNotes();
    renderPanel();
  }
});

// ---- अपडेट: नई index.html फ़ाइल फ़ोन से चुनकर ऐप को अपडेट करना (GitHub की ज़रूरत नहीं) ----
const APP_KEY = 'aw-app-html', PENDING_KEY = 'aw-app-pending';
const isStored = document.documentElement.dataset.shell !== 'bundled';
$('upd').addEventListener('click', () => {
  $('ver').textContent = `चल रहा वर्ज़न: ${VERSION} (${isStored ? 'फ़ाइल से अपडेट किया हुआ' : 'APK के अंदर का'})`;
  $('upmsg').textContent = '';
  $('sheet').hidden = false;
});
$('sheet-x').addEventListener('click', () => { $('sheet').hidden = true; });
$('pick').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const txt = await f.text();
  if (!txt.includes("const VERSION = '") || !txt.includes('AW · 3D')) {
    $('upmsg').textContent = 'यह AW की सही index.html फ़ाइल नहीं लगती।';
    return;
  }
  try { localStorage.setItem(APP_KEY, txt.replace(' data-shell="bundled"', '')); localStorage.removeItem(PENDING_KEY); }
  catch { $('upmsg').textContent = 'फ़ोन में जगह कम है, फ़ाइल सेव नहीं हो पाई।'; return; }
  $('upmsg').textContent = 'अपडेट सेव हो गया, ऐप दोबारा खुल रहा है...';
  setTimeout(() => location.reload(), 500);
});
$('reset').addEventListener('click', () => {
  localStorage.removeItem(APP_KEY); localStorage.removeItem(PENDING_KEY); location.reload();
});

setMsg('वर्ज़न ' + VERSION);
renderPanel();
animate();
// ऐप सही से शुरू हो गया, इसलिए अपडेट को पक्का मानें
localStorage.removeItem(PENDING_KEY);
</script>
</body>
</html>
